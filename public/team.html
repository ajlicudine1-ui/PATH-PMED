<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>P.A.T.H. | Team</title>

    <link
        rel="icon"
        type="image/png"
        href="/images/PMED-LOGO.png"
    >

    <link
        rel="stylesheet"
        href="/css/global.css"
    >

    <link
        rel="stylesheet"
        href="/css/team.css"
    >

    <style>
        .team-toolbar-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }

        .employment-status-filter {
            min-width: 210px;
            height: 52px;
            padding: 0 42px 0 16px;
            border: 1px solid #d7dde5;
            border-radius: 12px;
            background: #ffffff;
            color: #344054;
            font: inherit;
            font-size: 15px;
            cursor: pointer;
            outline: none;
        }

        .employment-status-filter:focus {
            border-color: #2f8a4b;
            box-shadow: 0 0 0 3px rgba(47, 138, 75, 0.12);
        }

        .team-toolbar-controls #searchInput {
            min-width: 280px;
        }

        @media (max-width: 800px) {
            .team-toolbar-controls {
                width: 100%;
                align-items: stretch;
            }

            .employment-status-filter,
            .team-toolbar-controls #searchInput {
                width: 100%;
                min-width: 0;
            }
        }
    </style>
</head>

<body class="admin-page">

    <div class="app-layout">

        <div id="sidebarContainer"></div>

        <main class="main-content">

            <header class="topbar viewer-topbar">

                <div class="viewer-topbar-brand">

                    <h2>
                        P.A.T.H.
                    </h2>

                    <p>
                        PMED Assignment and Team Hub
                    </p>

                </div>

                <button
                    type="button"
                    class="logout-button"
                    id="logoutBtn"
                >
                    Logout
                </button>

            </header>

            <section class="page-content">

                <div class="team-page-header">

                    <div>
                        <h1 id="teamCode"></h1>
                        <p id="teamName"></p>
                    </div>

                    <button
                        class="add-button"
                        id="addAssignmentBtn"
                        type="button"
                    >
                        + Add Assignment
                    </button>

                </div>

                <div class="team-card">

                    <div class="team-toolbar">

                        <div>
                            <h2>Personnel Assignments</h2>
                            <p>
                                Personnel functions and responsibilities
                                assigned to this team.
                            </p>
                        </div>


                        <div class="team-toolbar-controls">

                            <select
                                id="employmentStatusFilter"
                                class="employment-status-filter"
                                aria-label="Filter by employment status"
                            >
                                <option value="">
                                    All Employment Status
                                </option>

                                <option value="Permanent">
                                    Permanent
                                </option>

                                <option value="Contractual">
                                    Contractual
                                </option>

                                <option value="Job Order">
                                    Job Order
                                </option>
                            </select>


                            <input
                                type="search"
                                id="searchInput"
                                placeholder="Search personnel..."
                                autocomplete="off"
                            >

                        </div>

                    </div>

                    <div class="table-wrapper">

                        <table>

                            <thead>
                                <tr>
                                    <th>Responsible Person</th>
                                    <th>Designation</th>
                                    <th>Functions / Activities</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>

                            <tbody id="teamTableBody">
                                <tr>
                                    <td
                                        colspan="4"
                                        class="empty-state"
                                    >
                                        Loading assignments...
                                    </td>
                                </tr>
                            </tbody>

                        </table>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <div
        class="modal-overlay"
        id="assignmentModal"
    >

        <div class="modal-card">

            <div class="modal-header">

                <div>
                    <h2>Add Assignment</h2>
                    <p>
                        Add a new personnel assignment
                        for the selected team.
                    </p>
                </div>

                <button
                    type="button"
                    class="modal-close"
                    id="closeAssignmentModal"
                    aria-label="Close"
                >
                    &times;
                </button>

            </div>

            <form id="assignmentForm">

                <div class="form-group">

                    <label for="responsiblePerson">
                        Responsible Person
                        <span class="label-example">
                            (Example: Juan D. La Cruz)
                        </span>
                    </label>

                    <input
                        type="text"
                        id="responsiblePerson"
                        name="responsiblePerson"
                        placeholder="Enter full name"
                        autocomplete="off"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="employmentStatus">
                        Employment Status
                    </label>

                    <select
                        id="employmentStatus"
                        name="employmentStatus"
                        required
                    >
                        <option value="" selected disabled>
                            Select employment status
                        </option>

                        <option value="Permanent">
                            Permanent
                        </option>

                        <option value="Contractual">
                            Contractual
                        </option>

                        <option value="Job Order">
                            Job Order
                        </option>
                    </select>

                </div>

                <div class="form-group">

                    <label for="designation">
                        Designation
                    </label>

                    <input
                        type="text"
                        id="designation"
                        name="designation"
                        placeholder="Enter designation"
                        autocomplete="off"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="functionsActivities">
                        Functions / Activities
                    </label>

                    <textarea
                        id="functionsActivities"
                        name="functionsActivities"
                        rows="5"
                        placeholder="Enter functions or activities"
                        required
                    ></textarea>

                </div>

                <div class="modal-actions">

                    <button
                        type="button"
                        class="cancel-button"
                        id="cancelAssignment"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="save-button"
                        id="saveAssignment"
                    >
                        Save Assignment
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="/js/auth.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/team.js"></script>

</body>

</html>
